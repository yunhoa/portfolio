<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1450" viewBox="0 0 2400 1450" role="img" aria-labelledby="title desc">
  <title id="title">서울에서 뭐하고 놀지? JPA 엔티티 관계도</title>
  <desc id="desc">JPA 엔티티 매핑 기준 13개 테이블과 회원, 장소, 코스, 게시물, 댓글, 리뷰, 저장, 좋아요 관계를 표시한다. 실제 운영 DDL은 별도 확인이 필요하다.</desc>
  <defs>
    <style>
      text{font-family:'Consolas','Malgun Gothic','Apple SD Gothic Neo',monospace;fill:#293938}.title{font:700 29px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif}.sub{font:14px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#687875}.zone{font:700 16px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#52776f}.th{font:700 17px 'Consolas','Malgun Gothic',sans-serif}.field{font-size:13px}.type{font-size:11px;fill:#75817e}.rel{font:12px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#59736e}.card{fill:#fff;stroke:#a9bdb7;stroke-width:1.6}.row{stroke:#e5ece9;stroke-width:1}
    </style>
  </defs>
  <rect width="2400" height="1450" fill="#fff"/>
  <text x="55" y="52" class="title">서울에서 뭐하고 놀지? · JPA 엔티티 관계</text>
  <text x="55" y="80" class="sub">Entity @Table / @JoinColumn 기준 · PK 기본 키 · FK 외래 키 · UQ 고유 제약</text>
  <text x="2345" y="80" text-anchor="end" class="sub">운영 DDL 확정도가 아닌 객체-관계 매핑 표현</text>

