<svg viewBox="0 0 1600 750" role="img" aria-labelledby="diagram-title diagram-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="diagram-title">Proxmox 홈랩 네트워크 구성도</title>
        <desc id="diagram-desc">브라우저 URL에서 DuckDNS 조회를 거쳐 Proxmox의 pfSense, LAN, 내부 서비스로 연결되는 구조입니다.</desc>
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#526d7d"/></marker>
          <marker id="arrowDns" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#a67c37"/></marker>
          <style>
            .title { font: 650 16px Pretendard, 'Noto Sans KR', sans-serif; fill: #203441; }
            .body { font: 14px Pretendard, 'Noto Sans KR', sans-serif; fill: #40535f; }
            .note { font: 12px Pretendard, 'Noto Sans KR', sans-serif; fill: #64737d; }
            .number { font: 700 11px Pretendard, 'Noto Sans KR', sans-serif; fill: #fff; }
            .node { fill: #fff; stroke: #9eacb5; stroke-width: 1.5; }
            .outer { fill: #f7f9fa; stroke: #8d9ca5; stroke-width: 1.6; }
            .route { fill: none; stroke: #526d7d; stroke-width: 2.6; marker-end: url(#arrow); }
            .dns { fill: none; stroke: #a67c37; stroke-width: 1.9; stroke-dasharray: 7 6; marker-end: url(#arrowDns); }
          </style>
        </defs>

        <!-- DNS is a lookup, not a packet hop -->
        <rect x="245" y="54" width="250" height="104" rx="5" fill="#fffaf0" stroke="#c5a96f" stroke-width="1.5"/>
        <circle cx="269" cy="78" r="13" fill="#a67c37"/><text class="number" x="269" y="82" text-anchor="middle">2</text>
        <text class="title" x="292" y="83">DuckDNS</text>
        <text class="body" x="267" y="113">도메인 조회 → 등록 IP 응답</text>
        <text class="note" x="267" y="137">DDNS로 KT 공인 IP 레코드 갱신</text>

        <!-- Proxmox host boundary -->
        <rect class="outer" x="500" y="190" width="1080" height="465" rx="6"/>
        <text class="title" x="526" y="224">홈랩 네트워크</text>
        <text class="note" x="526" y="247">Proxmox 브리지와 VM/LXC, 연결된 KT 공유기까지의 경로</text>

        <!-- Client -->
        <rect class="node" x="30" y="330" width="190" height="132" rx="5"/>
        <circle cx="55" cy="356" r="13" fill="#526d7d"/><text class="number" x="55" y="360" text-anchor="middle">1</text>
        <text class="title" x="79" y="361">브라우저</text>
        <text class="body" x="52" y="399">URL 입력</text>
        <text class="note" x="52" y="427">https://내도메인</text>

        <!-- Public WAN -->
        <rect class="node" x="280" y="330" width="190" height="132" rx="5"/>
        <circle cx="305" cy="356" r="13" fill="#526d7d"/><text class="number" x="305" y="360" text-anchor="middle">3</text>
        <text class="title" x="329" y="361">공인 WAN</text>
        <text class="body" x="302" y="399">HTTPS 요청 도착</text>
        <text class="note" x="302" y="427">DuckDNS가 알려준 IP</text>
        <path class="dns" d="M105 330 C105 205 215 106 239 106"/>
        <path class="dns" d="M260 158 C235 224 170 260 130 325"/>
        <path class="route" d="M220 396 H274"/>

        <!-- Proxmox bridges, pfSense, KT router, and LAN services -->
        <rect x="515" y="330" width="130" height="132" rx="5" fill="#eef3f6" stroke="#8296a3" stroke-width="1.5"/>
        <circle cx="537" cy="356" r="13" fill="#526d7d"/><text class="number" x="537" y="360" text-anchor="middle">4</text>
        <text class="title" x="559" y="361">WAN</text>
        <text class="body" x="537" y="399">vmbr0 브리지</text>
        <text class="note" x="537" y="427">물리 NIC ↔</text>
        <text class="note" x="537" y="445">pfSense WAN</text>

        <rect x="695" y="310" width="150" height="172" rx="5" fill="#fff5e8" stroke="#c59b60" stroke-width="1.6"/>
        <circle cx="718" cy="337" r="13" fill="#9a6425"/><text class="number" x="718" y="341" text-anchor="middle">5</text>
        <text class="title" x="740" y="342">pfSense VM</text>
        <text class="body" x="717" y="382">방화벽 규칙 적용</text>
        <text class="body" x="717" y="408">NAT · 포트포워딩</text>
        <text class="note" x="717" y="445">KT 공유기로 요청</text>
        <text class="note" x="717" y="466">전달</text>

        <rect x="895" y="310" width="140" height="172" rx="5" fill="#f2f4f5" stroke="#9eacb5" stroke-width="1.6"/>
        <circle cx="918" cy="337" r="13" fill="#526d7d"/><text class="number" x="918" y="341" text-anchor="middle">6</text>
        <text class="title" x="940" y="342">KT 공유기</text>
        <text class="note" x="917" y="382">물리 장비</text>
        <text class="body" x="917" y="411">포트포워딩</text>
        <text class="body" x="917" y="435">NPM으로 전달</text>

        <rect x="1085" y="330" width="130" height="132" rx="5" fill="#edf5ef" stroke="#8eaf98" stroke-width="1.5"/>
        <circle cx="1107" cy="356" r="13" fill="#557e61"/><text class="number" x="1107" y="360" text-anchor="middle">7</text>
        <text class="title" x="1129" y="361">LAN</text>
        <text class="body" x="1107" y="399">vmbr1 브리지</text>
        <text class="note" x="1107" y="427">VM/LXC 연결</text>

        <rect x="1265" y="310" width="155" height="172" rx="5" fill="#edf5ef" stroke="#8eaf98" stroke-width="1.6"/>
        <circle cx="1288" cy="337" r="13" fill="#557e61"/><text class="number" x="1288" y="341" text-anchor="middle">8</text>
        <text class="title" x="1310" y="342">Nginx Proxy</text>
        <text class="title" x="1287" y="366">Manager</text>
        <text class="body" x="1287" y="405">도메인별 Proxy Host</text>
        <text class="note" x="1287" y="433">내부 IP · 포트 설정</text>
        <text class="note" x="1287" y="458">OpenSSL 인증서</text>

        <rect x="1460" y="330" width="110" height="132" rx="5" fill="#fff" stroke="#9eacb5" stroke-width="1.5"/>
        <circle cx="1482" cy="356" r="13" fill="#526d7d"/><text class="number" x="1482" y="360" text-anchor="middle">9</text>
        <text class="title" x="1504" y="361">서비스</text>
        <text class="body" x="1482" y="399">VM/LXC</text>
        <text class="note" x="1482" y="425">내부 IP</text>
        <text class="note" x="1482" y="445">+ 포트</text>

        <!-- Draw connectors last so arrowheads stay visible -->
        <g class="route">
          <path d="M470 396 H509"/>
          <path d="M645 396 H689"/>
          <path d="M845 396 H889"/>
          <path d="M1035 396 H1079"/>
          <path d="M1215 396 H1259"/>
          <path d="M1420 396 H1454"/>
        </g>

        <!-- Legend at the end of the diagram -->
        <g aria-label="선 구분">
          <line x1="1400" y1="684" x2="1432" y2="684" stroke="#526d7d" stroke-width="3"/>
          <text class="note" x="1444" y="688">접속 요청</text>
          <line x1="1400" y1="714" x2="1432" y2="714" stroke="#a67c37" stroke-width="2" stroke-dasharray="6 4"/>
          <text class="note" x="1444" y="718">DNS 조회·응답</text>
        </g>
      </svg>
