<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1100" viewBox="0 0 1700 1100" role="img" aria-labelledby="title desc">
  <title id="title">서울에서 뭐하고 놀지? UML 유스케이스</title>
  <desc id="desc">일반 사용자와 관리자, Kakao OAuth2·한국관광공사·TMAP·서울시 대중교통 시스템이 서비스 기능과 연결되는 UML 유스케이스 다이어그램.</desc>
  <defs>
    <marker id="include" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#718783" stroke-width="1.5"/></marker>
    <style>
      text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#293938}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#687875}.system{font-size:20px;font-weight:700;fill:#52776f}.actorLabel{font-size:15px;font-weight:600}.uc{font-size:16px}.line{fill:none;stroke:#7b8d88;stroke-width:1.8}.dep{fill:none;stroke:#a17a65;stroke-width:1.7;stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1700" height="1100" fill="#fff"/>
  <text x="55" y="58" class="title">서울에서 뭐하고 놀지? · 유스케이스</text>
  <text x="55" y="88" class="sub">사용자 기능과 외부 연동을 시스템 경계 안에서 구분</text>
  <rect x="300" y="130" width="1090" height="900" rx="14" fill="#fcfdfc" stroke="#829d96" stroke-width="2.5"/>
  <text x="845" y="170" text-anchor="middle" class="system">데이트 코스 서비스</text>

  <!-- Association connectors are behind actors and use cases. -->
  <g class="line">
    <path d="M130 430H245V315H420M245 430V450H420M245 450V585H420M245 450V720H420M245 450V855H420"/>
    <path d="M245 430H420"/>
    <path d="M1530 865H1450V880H1240"/>
    <path d="M1240 315H1490V295H1516M1240 450H1490V430H1516M1240 720H1490V565H1516M1490 720V700H1516"/>
  </g>
  <g class="dep">
    <path d="M850 315H684" marker-end="url(#include)"/>
    <path d="M684 450H850" marker-end="url(#include)"/>
    <path d="M850 720H684" marker-end="url(#include)"/>
  </g>

  <!-- User actor -->
  <g fill="none" stroke="#52776f" stroke-width="3" stroke-linecap="round">
    <circle cx="130" cy="365" r="18" fill="#fff"/><path d="M130 383V435M99 404H161M130 435L105 470M130 435L155 470"/>
  </g>
  <text x="130" y="500" text-anchor="middle" class="actorLabel">사용자</text>
  <!-- Admin actor -->
  <g fill="none" stroke="#a17a65" stroke-width="3" stroke-linecap="round">
    <circle cx="1530" cy="795" r="18" fill="#fff"/><path d="M1530 813V865M1499 834H1561M1530 865L1505 900M1530 865L1555 900"/>
  </g>
  <text x="1530" y="930" text-anchor="middle" class="actorLabel">관리자</text>

  <!-- External-system actors -->
  <g fill="none" stroke="#8b786c" stroke-width="2.5" stroke-linecap="round">
    <circle cx="1530" cy="275" r="11" fill="#fff"/><path d="M1530 286V309M1516 295H1544M1530 309L1518 326M1530 309L1542 326"/>
    <circle cx="1530" cy="410" r="11" fill="#fff"/><path d="M1530 421V444M1516 430H1544M1530 444L1518 461M1530 444L1542 461"/>
    <circle cx="1530" cy="545" r="11" fill="#fff"/><path d="M1530 556V579M1516 565H1544M1530 579L1518 596M1530 579L1542 596"/>
    <circle cx="1530" cy="680" r="11" fill="#fff"/><path d="M1530 691V714M1516 700H1544M1530 714L1518 731M1530 714L1542 731"/>
  </g>
  <text x="1530" y="348" text-anchor="middle" class="actorLabel">Kakao OAuth2</text>
  <text x="1530" y="483" text-anchor="middle" class="actorLabel">한국관광공사</text>
  <text x="1530" y="618" text-anchor="middle" class="actorLabel">TMAP</text>
  <text x="1530" y="753" text-anchor="middle" class="actorLabel">서울시 교통 API</text>

  <!-- Primary user functions -->
  <g fill="#edf4f1" stroke="#a9c0b9" stroke-width="1.7">
    <ellipse cx="552" cy="315" rx="132" ry="42"/><ellipse cx="552" cy="450" rx="132" ry="42"/><ellipse cx="552" cy="585" rx="132" ry="42"/><ellipse cx="552" cy="720" rx="132" ry="42"/><ellipse cx="552" cy="855" rx="132" ry="42"/>
  </g>
  <g text-anchor="middle" class="uc">
    <text x="552" y="321">회원가입 · 로그인</text>
    <text x="552" y="456">지역·관심사 코스 탐색</text>
    <text x="552" y="591">장소 정보 조회</text>
    <text x="552" y="726">코스 작성 · 저장 · 공유</text>
    <text x="552" y="861">게시물 · 리뷰 · 댓글</text>
  </g>
  <!-- External-backed user functions -->
  <g fill="#f8f3ef" stroke="#d6bfae" stroke-width="1.7">
    <ellipse cx="1045" cy="315" rx="195" ry="42"/><ellipse cx="1045" cy="450" rx="195" ry="42"/><ellipse cx="1045" cy="720" rx="195" ry="42"/>
  </g>
  <g text-anchor="middle" class="uc">
    <text x="1045" y="321">Kakao 계정 인증</text>
    <text x="1045" y="456">관광지 데이터 조회</text>
    <text x="1045" y="726">도보·대중교통 경로 조회</text>
  </g>
  <ellipse cx="1045" cy="880" rx="195" ry="42" fill="#f8f3ef" stroke="#d6bfae" stroke-width="1.7"/>
  <text x="1045" y="886" text-anchor="middle" class="uc">회원·리뷰 관리</text>

  <text x="765" y="298" text-anchor="middle" class="sub">«extend»</text>
  <text x="765" y="433" text-anchor="middle" class="sub">«include»</text>
  <text x="765" y="703" text-anchor="middle" class="sub">«extend»</text>
  <text x="1320" y="1010" text-anchor="end" class="sub">실선: 액터 연관 · 점선: «include» / «extend» 관계</text>
</svg>
