    <path class="row" d="M0 44H500M0 72H500M0 100H500M0 128H500M0 156H500M0 184H500M0 212H500M0 240H500M0 268H500M0 296H500M0 324H500"/>
    <g class="field"><text x="14" y="64">PK post_id</text><text x="14" y="92">FK user_id</text><text x="14" y="120">FK place_id</text><text x="14" y="148">FK course_id</text><text x="14" y="176">title · category</text><text x="14" y="204">content · photos</text><text x="14" y="232">likes</text><text x="14" y="260">user_name</text><text x="14" y="288">reg_dt</text><text x="14" y="316">up_dt</text></g><g class="type" text-anchor="end"><text x="484" y="64">String</text><text x="484" y="92">UserInfo · NOT NULL</text><text x="484" y="120">Place · optional</text><text x="484" y="148">Course · optional</text><text x="484" y="176">String</text><text x="484" y="204">String</text><text x="484" y="232">Integer</text><text x="484" y="260">String</text><text x="484" y="288">LocalDateTime</text><text x="484" y="316">LocalDateTime</text></g>
