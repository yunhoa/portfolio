    <path class="row" d="M0 44H500M0 72H500M0 100H500M0 128H500M0 156H500M0 184H500M0 212H500"/><g class="field"><text x="14" y="64">PK comment_id</text><text x="14" y="92">FK user_id</text><text x="14" y="120">FK post_id</text><text x="14" y="148">FK parent_comment_id</text><text x="14" y="176">content</text><text x="14" y="204">reg_dt · up_dt</text></g><g class="type" text-anchor="end"><text x="484" y="64">String</text><text x="484" y="92">UserInfo · NOT NULL</text><text x="484" y="120">Post · NOT NULL</text><text x="484" y="148">Comments · optional</text><text x="484" y="176">String</text><text x="484" y="204">LocalDateTime</text></g>
  </g>
  <g transform="translate(1220 860)">
    <rect class="card" width="500" height="152" rx="8"/><path d="M8 0H492Q500 0 500 8V44H0V8Q0 0 8 0Z" fill="#f7f0eb"/><text x="15" y="29" class="th">likes</text><text x="485" y="28" text-anchor="end" class="type">게시물 좋아요</text>
    <path class="row" d="M0 44H500M0 72H500M0 100H500M0 128H500"/><g class="field"><text x="14" y="64">PK like_id</text><text x="14" y="92">FK user_id · post_id</text><text x="14" y="120">reg_dt</text></g><g class="type" text-anchor="end"><text x="484" y="64">String</text><text x="484" y="92">NOT NULL</text><text x="484" y="120">LocalDateTime</text></g>
  </g>

  <!-- Reviews -->
  <g transform="translate(1840 150)">
    <rect class="card" width="500" height="260" rx="8"/><path d="M8 0H492Q500 0 500 8V44H0V8Q0 0 8 0Z" fill="#f7f0eb"/><text x="15" y="29" class="th">place_review</text><text x="485" y="28" text-anchor="end" class="type">장소 리뷰</text>
    <path class="row" d="M0 44H500M0 72H500M0 100H500M0 128H500M0 156H500M0 184H500M0 212H500M0 240H500"/><g class="field"><text x="14" y="64">PK place_review_id</text><text x="14" y="92">FK place_id</text><text x="14" y="120">FK user_id</text><text x="14" y="148">review_title · review_text</text><text x="14" y="176">review_like</text><text x="14" y="204">reg_dt</text><text x="14" y="232">up_dt</text></g><g class="type" text-anchor="end"><text x="484" y="64">String</text><text x="484" y="92">Place · NOT NULL</text><text x="484" y="120">UserInfo · NOT NULL</text><text x="484" y="148">String</text><text x="484" y="176">Integer</text><text x="484" y="204">LocalDateTime</text><text x="484" y="232">LocalDateTime</text></g>
