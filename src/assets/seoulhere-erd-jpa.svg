    <rect class="card" width="500" height="341" rx="8"/><path d="M8 0H492Q500 0 500 8V44H0V8Q0 0 8 0Z" fill="#f7f0eb"/><text x="15" y="29" class="th">review</text><text x="485" y="28" text-anchor="end" class="type">코스/장소 리뷰</text>
    <path class="row" d="M0 44H500M0 72H500M0 100H500M0 128H500M0 156H500M0 184H500M0 212H500M0 240H500M0 268H500M0 296H500M0 324H500"/><g class="field"><text x="14" y="64">PK review_id</text><text x="14" y="92">FK place_id</text><text x="14" y="120">FK course_id</text><text x="14" y="148">FK user_id</text><text x="14" y="176">place_or_course</text><text x="14" y="204">review · review_text</text><text x="14" y="232">photo · review_like</text><text x="14" y="260">reg_dt</text><text x="14" y="288">up_dt</text></g><g class="type" text-anchor="end"><text x="484" y="64">String</text><text x="484" y="92">Place · NOT NULL</text><text x="484" y="120">Course · optional</text><text x="484" y="148">UserInfo · NOT NULL</text><text x="484" y="176">String</text><text x="484" y="204">String</text><text x="484" y="232">String · int</text><text x="484" y="260">LocalDateTime</text><text x="484" y="288">LocalDateTime</text></g>
  </g>

  <rect x="1220" y="1080" width="1120" height="260" rx="10" fill="#f4f6f4" stroke="#ccd7d2" stroke-width="1.5"/>
  <text x="1245" y="1115" class="zone">모델 기준 및 참고</text>
  <text x="1245" y="1150" class="sub">• JPA 엔티티에서 확인한 13개 매핑 테이블을 표시했습니다.</text>
  <text x="1245" y="1182" class="sub">• favorite_place는 user_id + place_id 조합에 unique 제약이 있습니다.</text>
  <text x="1245" y="1214" class="sub">• comments.parent_comment_id가 같은 테이블을 참조합니다. 별도 replies 엔티티는 없습니다.</text>
  <text x="1245" y="1246" class="sub">• application-prod.yml은 ddl-auto: none이며, table.sql과 엔티티의 컬럼 정의가 다릅니다.</text>
  <text x="1245" y="1278" class="sub">  따라서 이 그림은 JPA 매핑 관계도이며 운영 DB 물리 스키마를 확정한 문서는 아닙니다.</text>
</svg>
